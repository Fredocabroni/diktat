name: deploy-railway

# TODO(railway): activates only when RAILWAY_TOKEN secret is present AND repo
# variable ENABLE_RAILWAY_DEPLOY=true. Until then this workflow is a no-op stub
# and does NOT fail CI.
#
# Activation safety (do NOT flip ENABLE_RAILWAY_DEPLOY=true without checking):
#   - All `uses:` action refs MUST stay SHA-pinned. Floating @vN tags would
#     re-introduce a tag-move exfil vector on RAILWAY_TOKEN.
#   - The Railway CLI install MUST stay version-pinned (npm @railway/cli@<X>).
#     Replacing it with `curl | sh` or `@latest` reopens the unpinned-script
#     hazard the bundle PR closed.
# Both constraints are mechanically enforced by
# `.github/scripts/check-activation-safety.sh`, invoked from `ci.yml`'s
# `verify` job — that script fails the build red when
# vars.ENABLE_RAILWAY_DEPLOY == 'true' and this file regresses on either.
#
# ─── Single source of truth for Railway deploys ───────────────────────────
# This workflow is the ONLY authorised Railway deploy trigger. Railway's own
# GitHub integration auto-deploys on every push to main unless the service
# manifest's `watchPatterns` is set to a provably-unmatchable glob. Set BOTH
# services' watchPatterns via the Railway dashboard to:
#   watchPatterns: ['_disabled_deploy_handled_by_gha/**']
# This leaves the GitHub repo link + commit metadata display intact while
# telling Railway "nothing on push matched; do not auto-deploy." The GHA
# `railway up --detach` path below uploads a snapshot and bypasses
# watchPatterns, so our deploys still work. (See the companion PR body for
# the exact dashboard steps.)

on:
  push:
    branches: [main]
    # Top-level paths filter is the UNION of every service's dependency
    # set. Individual services then gate their matrix leg on their own
    # per-service dorny/paths-filter output (see `scope` job below) so a
    # change to only `packages/ap-engine/**` deploys workers but skips
    # api and bots. Root config files invalidate every Nixpacks build
    # layer, so they trigger all three.
    paths:
      - "apps/api/**"
      - "apps/workers/**"
      - "apps/bots/**"
      - "packages/db/**"
      - "packages/auth/**"
      - "packages/shared/**"
      - "packages/ai-fabric/**"
      - "packages/ap-engine/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig*.json"
      - ".npmrc"
      - ".nvmrc"

permissions:
  contents: read

jobs:
  guard:
    name: deploy-guard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Skip — TODO(railway)
        run: |
          echo "Railway deploy stub. Set repo variable ENABLE_RAILWAY_DEPLOY=true and"
          echo "secret RAILWAY_TOKEN once you sign up for Railway. Stub is a no-op."

  # Per-service dependency scope. Each service deploys only when ITS own
  # paths change. Dependency graph derived from each app's package.json
  # workspace `@diktat/*` imports (direct + transitive):
  #   api     → auth → db + shared, db, shared
  #   workers → ai-fabric → shared, ap-engine → shared, shared
  #   bots    → (no workspace deps today)
  # All three fire on root config changes.
  scope:
    name: classify-service-scope
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ vars.ENABLE_RAILWAY_DEPLOY == 'true' }}
    outputs:
      api: ${{ steps.filter.outputs.api }}
      workers: ${{ steps.filter.outputs.workers }}
      bots: ${{ steps.filter.outputs.bots }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: filter
        # dorny/paths-filter@v4.0.1 (SHA pin — trust-boundary action, see
        # claude-review.yml header for the moved-tag threat model). The
        # same action is used by the reviewer workflows.
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/auth/**'
              - 'packages/db/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.npmrc'
              - '.nvmrc'
            workers:
              - 'apps/workers/**'
              - 'packages/ai-fabric/**'
              - 'packages/ap-engine/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.npmrc'
              - '.nvmrc'
            bots:
              - 'apps/bots/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.npmrc'
              - '.nvmrc'

  deploy:
    name: deploy ${{ matrix.service }} → Railway
    needs: [guard, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ vars.ENABLE_RAILWAY_DEPLOY == 'true' }}
    # Per-service concurrency: a new push for the SAME service cancels the
    # in-flight deploy for that service only. Group includes the matrix
    # service name so api, workers, and bots deploy independently without
    # cross-service serialisation. Fixes the four-rapid-merges race on
    # 2026-09-30 where workers' aa70e57 deploy got dropped by Railway while
    # a sibling api deploy was mid-flight.
    concurrency:
      group: deploy-railway-${{ matrix.service }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        service: [api, workers, bots]
    env:
      # Per-service gate: fetched once at job-level so Install / Deploy
      # steps share one `env.SHOULD_DEPLOY == 'true'` check instead of
      # repeating a 3-arm OR. Pattern mirrors claude-review.yml's
      # SHOULD_RUN env.
      #
      # NOTE: SHOULD_DEPLOY is a STRING ('true' / 'false'), not a boolean.
      # Every consumer MUST test explicitly against the string. NEVER
      # write `if: ${{ env.SHOULD_DEPLOY }}` — the string 'false' is
      # truthy in a bare boolean context and would run the deploy
      # unconditionally, including on PRs where the service's paths
      # didn't change.
      SHOULD_DEPLOY: >-
        ${{ (matrix.service == 'api' && needs.scope.outputs.api == 'true')
            || (matrix.service == 'workers' && needs.scope.outputs.workers == 'true')
            || (matrix.service == 'bots' && needs.scope.outputs.bots == 'true') }}
    steps:
      # actions/checkout@v4.2.2 — SHA-pinned. Same threat model as ci.yml +
      # claude-review.yml: this job receives RAILWAY_TOKEN in the Deploy
      # step; a tag-move on `v4` would inject attacker-controlled code into
      # the checkout layer that runs before the credential is scoped.
      # Activation-bundle hardening (queue entry "Deploy-workflow hardening
      # bundle" in TYRION_BUILD_QUEUE.md, P0-with-deploy-activation).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # In-job activation-safety re-check (PR #78 round-1 security-reviewer
      # LOW#5). The ci.yml-level gate only consults `vars.ENABLE_*`; a
      # `workflow_dispatch` (or any other future trigger that bypasses the
      # ENABLE_* flag) would deploy without the pin check ever firing. This
      # step runs the same script with the flag FORCED to 'true' so the
      # pin check fires unconditionally whenever a deploy job actually
      # executes, regardless of trigger. The ci.yml invocation remains the
      # signal that an operator armed the flag — this is the belt-and-
      # suspenders that catches every other execution path.
      - name: Activation-safety re-check (in-job)
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        env:
          ENABLE_RAILWAY_DEPLOY: 'true'
        run: bash .github/scripts/check-activation-safety.sh

      # actions/setup-node@v4.4.0 — SHA-pinned. Needed by the `npm i -g`
      # below; the @latest hazard the bundle closed was specifically about
      # the CLI version, but the setup-node step itself must also stay
      # pinned for the same trust-boundary reason (it configures the npm
      # registry that the subsequent install trusts).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        with:
          node-version-file: .nvmrc

      # Pin @railway/cli to an exact version (NOT `@latest`). A compromised
      # publish to the `latest` dist-tag would inject code into the Deploy
      # step that has RAILWAY_TOKEN in env. Replaces the previous
      # `curl -fsSL https://railway.app/install.sh | sh` which was both
      # unpinned (no checksum) and ran an arbitrary remote script — the
      # bundle PR closed both surfaces in one swap. Bump deliberately via
      # the activation-bundle / Renovate cadence. Setup-node's global bin
      # is on PATH so no PATH munging needed.
      - name: Install Railway CLI
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        run: npm i -g @railway/cli@5.20.0

      - name: Deploy
        if: ${{ env.SHOULD_DEPLOY == 'true' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd "apps/${{ matrix.service }}"
          railway up --service "diktat-${{ matrix.service }}" --detach

      - name: Skipped — service unaffected by this diff
        if: ${{ env.SHOULD_DEPLOY != 'true' }}
        run: |
          echo "deploy-railway/${{ matrix.service }} — diff does not touch this service's dependency scope, skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "deploy-railway/${{ matrix.service }} — diff does not touch this service's dependency scope, skipped"
