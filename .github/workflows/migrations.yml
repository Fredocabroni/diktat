name: migrations-fresh-apply

# Closes the [P0-before-prod] CI-doesn't-apply-migrations-to-a-fresh-DB
# gap. Boots a clean local supabase stack on the GHA runner and applies
# every migration in `supabase/migrations/` from empty. Any migration
# error fails the step (and the job).
#
# Path-filtered: only runs when migrations or this workflow file change.
# The fresh apply is deterministic given the migration set, so re-running
# on a typo'd README change would just burn CI minutes.
#
# Pin posture: setup-cli is pinned to a full commit SHA — it installs
# the binary that does the migration apply, so a compromised release
# tag could mark a broken migration set as clean. Same trust-boundary
# argument as the queued docs-only-guard paths-filter pin. Utility
# actions (`actions/checkout`) were SHA-pinned in PR #68 — see the
# pin block on each step. PR #67 round-2 reviewer MEDIUM-3.

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/sql/**"
      - ".github/workflows/migrations.yml"
      # Invariant monitor: handler + test + the writers whose outputs it
      # validates. A writer refactor (settle order, ref_type/ref_id shape,
      # apply_ap_drafts / place_prediction wiring) that drifts from the
      # monitor's query MUST re-run this job -- that's the whole point.
      - "apps/workers/src/jobs/invariant-check.ts"
      - "apps/workers/__tests__/jobs/invariant-check.test.ts"
      - "apps/workers/src/jobs/battle-runner.ts"
      - "apps/workers/src/jobs/open-debate-runner.ts"
      - "packages/ap-engine/**"
      - "packages/shared/src/enums.ts"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/sql/**"
      - ".github/workflows/migrations.yml"
      - "apps/workers/src/jobs/invariant-check.ts"
      - "apps/workers/__tests__/jobs/invariant-check.test.ts"
      - "apps/workers/src/jobs/battle-runner.ts"
      - "apps/workers/src/jobs/open-debate-runner.ts"
      - "packages/ap-engine/**"
      - "packages/shared/src/enums.ts"

permissions:
  contents: read

jobs:
  fresh-apply:
    name: migrations from empty
    runs-on: ubuntu-latest
    # Local stack boot is the slow step (~60–90s); reset is fast.
    # 10 min is comfortable headroom for a 27-migration set.
    timeout-minutes: 10
    steps:
      # actions/checkout@v4.2.2 — SHA-pinned. Load-bearing for migration
      # correctness: this step populates the migration files the
      # subsequent `supabase db reset` applies. A moved `v4` tag could
      # substitute attacker-controlled SQL before the apply. PR #67
      # round-2 reviewer MEDIUM-3.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # supabase/setup-cli@v2.1.1 — pinned to the v2.1.1 release SHA
      # (2026-05-21). Trust-boundary pin on the installer (action SHA);
      # the CLI binary it downloads is pinned to the current stable
      # 2.107.0 release so a future CLI version cannot silently flip
      # migration validity in CI. PR #62 round-3 LOW-4.
      # Pin floor: pg17 support (supabase/config.toml [db].major_version
      # = 17). Bump when adopting newer CLI config features; CI fails
      # loud if the pin falls below pg17 support.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.107.0

      # Boots Postgres + auth + storage + realtime in Docker (preinstalled
      # on `ubuntu-latest`). Six of the 27 migrations reference auth.uid()
      # / TO {authenticated,service_role,anon} / references auth.users, so
      # the `auth` schema and the supabase roles MUST exist before the
      # migration apply — bare Postgres would fail those migrations.
      - name: Start local supabase stack
        run: supabase start

      # `supabase db reset` drops the local DB, recreates it, and applies
      # every migration in `supabase/migrations/` in timestamp order from
      # empty. No `--no-seed` needed: `supabase/seed.sql` does not exist
      # in this repo. Non-zero exit on the first migration that errors;
      # the job inherits that exit code.
      - name: Apply all migrations from empty
        run: supabase db reset

      # Behavioral DB tests under `supabase/tests/sql/**.test.sql`.
      # The stack is still up from `supabase start`; Postgres on
      # 127.0.0.1:54322 with default supabase local creds
      # (postgres:postgres). `psql` is preinstalled on the
      # ubuntu-latest runner.
      #
      # Default connection is the postgres superuser, which BYPASSES
      # RLS — that's the right starting posture for trigger /
      # constraint tests that prove DB-layer enforcement independent
      # of RLS. RLS tests opt INTO RLS by `set local role
      # authenticated` + `set local request.jwt.claims` mid-script
      # (see `battle_participants_rls.test.sql` for the pattern).
      #
      # `ON_ERROR_STOP=1` makes any sqlstate that escapes a DO-block's
      # exception handler abort the script. GHA bash defaults to
      # `bash --noprofile --norc -eo pipefail` — a non-zero psql exit
      # aborts the loop and fails the step. Adding a new test is a
      # one-file drop into `supabase/tests/sql/`; no workflow edit
      # needed. Test files follow the canonical
      # begin / fixtures / A1..An assertions / rollback / final \echo
      # pattern (see `debate_votes_participation.test.sql`).
      - name: Behavioral DB tests (triggers / constraints / RLS)
        run: |
          for f in supabase/tests/sql/*.test.sql; do
            echo "─── $f ───"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 -f "$f"
          done

      # Install workspace deps for the TS handler test. The install runs
      # after the DB is already up so the boot cost from `supabase start`
      # runs in parallel with checkout; a cache miss on pnpm store is the
      # only serial cost.
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # TS invariant-check tests. TEST_DATABASE_URL points at the local
      # supabase Postgres started above (127.0.0.1:54322). DIKTAT_DB_TESTS_REQUIRED
      # tells the test file to FAIL if TEST_DATABASE_URL is unexpectedly missing
      # -- inside THIS job a silent skip would defeat the whole point of the
      # invariant monitor.
      #
      # `pnpm turbo test` (not `pnpm --filter … test`) is required so
      # workers' internal workspace deps (`@diktat/shared`, `@diktat/ai-fabric`,
      # `@diktat/ap-engine`) build first -- vitest resolves `@diktat/shared`
      # to `packages/shared/dist/index.js`, which the raw script does not
      # create. The turbo pipeline's `test: { dependsOn: ["^build"] }` clause
      # in turbo.json handles that.
      - name: TS invariant-check tests (DB-backed)
        env:
          # The `postgres:postgres` credential below is the default the
          # Supabase local CLI hardcodes for its ephemeral loopback stack;
          # it is scoped to 127.0.0.1:54322 on this runner, torn down when
          # the job ends, and has NO relationship to any hosted project.
          # NEVER use this shape as a template for real DB credentials —
          # any hosted `DATABASE_URL` MUST come from a GitHub secret and be
          # referenced as `${{ secrets.* }}` at a minimum. (Round-1
          # security-review finding 5 — contributor-pattern hygiene.)
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          DIKTAT_DB_TESTS_REQUIRED: "1"
        run: pnpm turbo test --filter=@diktat/workers -- invariant-check
