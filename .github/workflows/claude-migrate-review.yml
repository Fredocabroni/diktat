name: claude-migrate-review

on:
  pull_request:
    branches: [main]
    # Trigger types mirror claude-review.yml (operator cost-cut,
    # 2026-10-20): fire on label events + sync + draft→ready so an
    # unlabelled PR has a visible RED gate from day 1, and the label
    # addition / removal triggers the reviewer to run / skip.
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    paths:
      - "supabase/migrations/**"
      - "packages/db/**"

# Concurrency lives at the JOB level on the `schema-review` job below
# (PR #143 round-2 security-review M1). schema-reviewer is the load-
# bearing RLS / FK / privilege guard for migration PRs — cancelling it
# mid-flight while no branch-protection status check requires it to
# complete would let a developer race a trivial follow-up commit to
# suppress the review and merge before the fresh run finishes. Setting
# `cancel-in-progress: false` on the job means a new push queues behind
# the in-flight review; the previous run always completes.
#
# Re-check this posture if branch protection is ever enabled on `main`
# with schema-reviewer marked as a required status check — under that
# gate, `cancel-in-progress: true` is safe again because a cancelled
# run leaves the check pending and blocks the merge until a fresh run
# completes.
#
# The `changes` classifier job intentionally has no concurrency block
# below — it's cheap, idempotent, produces no security output, and
# GitHub's default fire-forever behavior is fine there.

permissions:
  contents: read
  pull-requests: write

jobs:
  # Docs-only guard — harmonized with claude-review.yml. The
  # workflow-level `paths:` filter already constrains triggers to
  # supabase/migrations/** + packages/db/**, so this guard is mostly
  # redundant on its current shape (those paths are always `code`).
  # We add it anyway for symmetry with claude-review.yml and to
  # future-proof against any widening of the workflow trigger.
  changes:
    name: classify-diff
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: ${{ vars.ENABLE_CLAUDE_REVIEW == 'true' }}
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # actions/checkout@v4.2.2 — SHA-pinned. The `changes` classifier
      # output gates whether the schema reviewer runs at all; the
      # checkout is part of the trust boundary that determines the
      # review surface. PR #67 round-2 reviewer MEDIUM-3.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - id: filter
        # dorny/paths-filter@v4.0.1 (SHA pin — trust-boundary action).
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'supabase/migrations/**'
              - '.github/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'eslint.config.*'
              - 'vitest.config.*'
              - 'vite.config.*'
              - '.nvmrc'
              - '.npmrc'
              - 'supabase/config.toml'
            docs:
              - 'docs/**'
              - 'README*'
              - '*.md'

  schema-review:
    name: schema-reviewer
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never cancel a schema review mid-flight — see workflow header
    # comment for the rationale. If a new push arrives while this job
    # is running, GitHub queues the new run behind this one.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-schema-review
      cancel-in-progress: false
    # Gate via repo Variable: set ENABLE_CLAUDE_REVIEW=true to activate.
    # Extra `labeled`-event guard (2026-10-20 cost cut): act on the
    # `ready-for-review` label only; unrelated labels don't re-trigger.
    if: >-
      ${{ vars.ENABLE_CLAUDE_REVIEW == 'true'
          && (github.event.action != 'labeled'
              || github.event.label.name == 'ready-for-review') }}
    env:
      # 2026-10-20 operator cost-cut. See claude-review.yml for the
      # full contract; the label gate below reads this and fails fast
      # if absent so no Anthropic token is spent on an unlabelled PR.
      LABEL_READY: >-
        ${{ contains(github.event.pull_request.labels.*.name, 'ready-for-review') }}
      IN_SCOPE: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      # Label gate (2026-10-20 cost cut). Mirrors claude-review.yml:
      # "pending/skipped = not passed" — the schema-reviewer status
      # check reports RED on an unlabelled migration PR, blocking merge
      # instead of silently passing. When the diff is out of scope
      # (docs-only), the gate step skips and the step below's own
      # scope conditional emits the "no scope" audit line.
      - name: Gate — require ready-for-review label
        if: ${{ env.IN_SCOPE == 'true' && env.LABEL_READY != 'true' }}
        run: |
          echo "::error::schema-reviewer: this PR must carry the 'ready-for-review' label to run the AI reviewer. Add it when free checks (lint/typecheck/test/migrations-from-empty) are green."
          {
            echo "### schema-reviewer: label gate"
            echo ""
            echo "Migration PR does not carry the \`ready-for-review\` label. Add the label to run the schema reviewer; the merge-gate check will stay RED until the label is present AND the reviewer returns PASS."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # actions/checkout@v4.2.2 — SHA-pinned. The schema-reviewer agent
      # reads migration files from the working tree; a moved `v4` tag
      # could substitute attacker-controlled SQL diffs and shape what
      # the reviewer reports. PR #67 round-2 reviewer MEDIUM-3.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # actions/setup-node@v4.4.0 — SHA-pinned. Same threat model as
      # claude-review.yml: this job receives ANTHROPIC_API_KEY in the
      # reviewer step's env; tag-move at node-setup runs before the
      # credential is scoped. PR #67 round-2 reviewer MEDIUM-3.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      # Pinned to the stable channel (not floating latest) — this is a
      # key-bearing review step; the gate should not track npm's
      # default-pull velocity. Bump deliberately via the stable
      # promotion cadence. PR #71 round-2 MED.
      # Install when the PR touches code (which, given the workflow's
      # `paths:` filter, means supabase/migrations/**). Prior condition
      # also installed on `docs == 'false'`, which for a no-files PR
      # (both outputs empty strings) evaluated to true and triggered
      # an install-plus-agent-call against no changed migrations. See
      # security-reviewer #205 round-1 LOW 4.
      - name: Install Claude Code
        if: ${{ needs.changes.outputs.code == 'true' && env.LABEL_READY == 'true' }}
        run: npm i -g @anthropic-ai/claude-code@2.1.176

      # Compute the PR migration diff. Scoped to supabase/migrations/
      # and packages/db/ — the only two paths the schema-reviewer is
      # responsible for. Writing to ./pr.diff gives the reviewer a
      # deterministic surface instead of forcing the subagent to
      # infer which files are in the PR from git state (which drifted
      # onto already-merged migrations outside the diff on PR #221
      # push-1 and push-2 — logged on #167).
      #
      # Also prints `git diff --name-only` to stdout and appends the
      # file list to $GITHUB_STEP_SUMMARY so the surface is visible
      # in the workflow log and the run summary without opening the
      # pr.diff artifact.
      #
      # `github.base_ref` is piped through env for consistent quoting
      # (same pattern as claude-review.yml's REVIEW_PROMPT / REVIEW_MODEL).
      - name: Compute PR diff
        if: ${{ needs.changes.outputs.code == 'true' && env.LABEL_READY == 'true' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Base ref is checked out fetch-depth: 0, so origin/<base>
          # exists locally.
          git diff "origin/${BASE_REF}...HEAD" -- supabase/migrations/ packages/db/ > pr.diff
          echo "Files in diff:"
          git diff --name-only "origin/${BASE_REF}...HEAD" -- supabase/migrations/ packages/db/
          wc -l pr.diff
          # Wrap the file list in a fenced code block so filenames
          # with markdown control characters (backticks, angle brackets,
          # bare URLs) render as literal text in the step summary.
          # Cosmetic hardening per #167 (LOW A in #222's security
          # review): `$GITHUB_STEP_SUMMARY` is a markdown file the
          # GitHub UI parses, not a workflow-command sink, so no
          # execution risk — just unexpected rendering if a path
          # contains markdown.
          {
            echo "### schema-reviewer input: files in diff"
            echo ""
            echo '```'
            git diff --name-only "origin/${BASE_REF}...HEAD" -- supabase/migrations/ packages/db/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Capture-then-post pattern, harmonized with claude-review.yml.
      # The prior legacy shape asked the agent to shell out to
      # `gh pr comment` itself — claude -p's headless Bash-permission
      # gate blocked that call, and the step also had no GH_TOKEN in
      # env, so schema-reviewer never actually posted ANY comment.
      # The check exited 0 from `|| true` and the silent-APPROVE
      # shape we saw on PRs #45 / #46 was the consequence: a check
      # bucket with a green tick and no body.
      #
      # The new shape captures stdout to a file, captures the exit
      # code, and posts via gh pr comment from a step that does have
      # GH_TOKEN. Same gate-integrity script as claude-review.yml.
      - name: Run schema-reviewer
        if: ${{ needs.changes.outputs.code == 'true' && env.LABEL_READY == 'true' }}
        env:
          # 2026-10-22 cost cut: prefer DIKTAT_CI_ANTHROPIC_KEY so CI
          # reviewers and prod workers/api can be on different
          # Anthropic workspaces. See claude-review.yml for the full
          # rollout note.
          ANTHROPIC_API_KEY: ${{ secrets.DIKTAT_CI_ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          claude -p "Run the schema-reviewer subagent on the migration diff at ./pr.diff. Review ONLY the migration files that appear in that diff (added, modified, or renamed under supabase/migrations/ or packages/db/). You MAY read earlier migrations for context (schema state at apply time, prior constraints a new migration depends on), but a finding on a migration file that the diff doesn't touch must be omitted entirely. The newest already-applied migration is the newest migration file that exists on the base branch, not any file in the diff. Output ONLY the review report in markdown. The VERY FIRST non-blank line of your output MUST be a markdown header (e.g. '# Schema Review') — do not precede it with any preamble. The VERY LAST non-blank line of your output MUST be EXACTLY \`VERDICT: PASS\` or \`VERDICT: BLOCK\` (no decoration, no trailing period, nothing after it). Nothing else — no closing summary, no meta-comment, no note about the report itself. The report + final VERDICT line IS your entire output. Do NOT edit files, request write or file permissions, run shell commands, or take any tool action of any kind. You are a read-only reviewer: if the diff has defects, name them and recommend the fix IN THE REPORT — never apply or offer to apply changes yourself. A human approves every change." \
            --model claude-sonnet-4-6 \
            --max-turns 10 \
            --output-format text > review_output.md
          echo "$?" > review_exit_code
          set -e

      - name: Post review
        if: ${{ needs.changes.outputs.code == 'true' && env.LABEL_READY == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          exit_code=$(cat review_exit_code 2>/dev/null || echo 1)
          # check-review-output.sh contract:
          #   exit 0 + stdout "ok"    → real review, post review_output.md.
          #   exit 0 + stdout "empty" → no scope, post nothing.
          #   exit 1 + stdout REASON  → upstream failure. REASON is a
          #                              CONTROLLED string (classified
          #                              message, no raw agent body).
          #                              Post REASON, log raw stdout,
          #                              exit 1.
          if status=$(.github/scripts/check-review-output.sh review_output.md "$exit_code"); then
            case "$status" in
              ok)
                gh pr comment "$PR_NUMBER" --body-file review_output.md
                ;;
              ok_block)
                # BLOCK verdict: post the review AND fail the check.
                # The post happens FIRST so the body is on the PR even
                # if the subsequent `exit 1` were replaced by a crash;
                # the ::error:: annotation shows up in the GHA UI next
                # to the red X so a reviewer scrolling the checks list
                # sees why the gate failed without opening the comment.
                # Mirrors the ok_block arm in claude-review.yml:351.
                # Without this arm, a legitimate schema BLOCK fell
                # through to the `*)` catch-all and errored before the
                # raw agent output was dumped, so the BLOCK verdict was
                # lost entirely (observed on PR #179's round-2 run
                # 37717588074 — the schema-reviewer BLOCKed F-TYPES +
                # F-RATELIMIT-IDEM, but neither finding reached the PR).
                gh pr comment "$PR_NUMBER" --body-file review_output.md
                echo "::error::Reviewer verdict: BLOCK — see the posted PR comment for details."
                exit 1
                ;;
              ambiguous)
                # Ambiguous verdict: header + non-trivial body, but no
                # detectable PASS / APPROVE / BLOCK marker. Mirrors the
                # ambiguous arm in claude-review.yml. Without this arm the
                # status fell through to `*)`, which failed the check
                # (correct) but never posted the body, so the operator
                # could not see what schema-reviewer actually said.
                # Fail closed: post the body, then exit 1.
                gh pr comment "$PR_NUMBER" --body-file review_output.md
                echo "::error::Reviewer gate: ambiguous verdict — review body posted but no explicit PASS/BLOCK marker found. Rerun the workflow or ask the reviewer agent to end with the explicit verdict."
                exit 1
                ;;
              empty)
                echo "schema-reviewer produced no substantive output (no files in scope)"
                ;;
              *)
                echo "::error::unrecognized status from check-review-output.sh: $status"
                exit 1
                ;;
            esac
          else
            # Failure branch: post the CONTROLLED reason from the
            # script (NOT --body-file review_output.md). Exfil
            # hardening per PR #51 round-1 security-reviewer M1.
            # See claude-review.yml's matching block for the full
            # rationale.
            gh pr comment "$PR_NUMBER" --body "$status" || true
            echo "::group::raw agent stdout (workflow log only — not posted to PR)"
            cat review_output.md || true
            echo "::endgroup::"
            exit 1
          fi

      # Docs-only audit signal — harmonized with claude-review.yml.
      # Fires ONLY when the PR is PROVABLY docs-only (docs touched AND
      # no code-allowlist match). The vars-disabled path stays clean
      # because both outputs are empty strings and neither half of the
      # AND matches.
      - name: Audit — docs-only diff, schema-reviewer skipped
        if: ${{ needs.changes.outputs.code == 'false' && needs.changes.outputs.docs == 'true' }}
        run: |
          echo "docs-only diff — schema-reviewer agent skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "docs-only diff — schema-reviewer agent skipped"
